[project]
name = "pg-inspect-mcp"
version = "0.1.0"
description = "Read-only Postgres schema-inspection MCP server. Writes are structurally impossible, not merely forbidden."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0", "psycopg[binary]>=3.1"]

[project.scripts]
pg-inspect-mcp = "pg_inspect_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_inspect_mcp"]
